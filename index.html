<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Restaurant Header -->
    <header class="restaurant-header">

        <div class="restaurant-cover">
            <img src="Images/im.png" alt="Restaurant">
        </div>

        <div class="restaurant-info">

            <img src="Images/restaurant-logo1.png" alt="Restaurant Logo" class="restaurant-logo">

            <h1>Restaurant Merova</h1>

            <p>Mirë se vini në restorantin tonë</p>

            <div class="restaurant-details">
                <span>🍽️ Restaurant</span>
                <span>📍 Tetovë</span>
            </div>

        </div>

    </header>


    <!-- Main Content -->
    <main class="container">

        <section class="menu-heading">
            <h2>Menuja jonë</h2>
            <p>Zgjidhni ushqimin tuaj të preferuar</p>
        </section>


        <!-- Search -->
        <div class="search-container">
            <span>⌕</span>
            <input
                type="search"
                id="searchInput"
                placeholder="Kërko ushqim..."
            >
        </div>


        <!-- Categories -->
        <nav class="category-navigation" id="categoryNavigation">
            <!-- Categories generated by JavaScript -->
        </nav>


        <!-- Products -->
        <section class="products-section">

            <div class="products-heading">
                <h2 id="categoryTitle">Të gjitha produktet</h2>
                <span id="productCount"></span>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products generated by JavaScript -->
            </div>

            <div class="no-results" id="noResults" hidden>
                <h3>Nuk u gjet asnjë produkt</h3>
                <p>Provoni të kërkoni diçka tjetër.</p>
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <img src="Images/restaurant-logo1.png" alt="Logo">

        <h3>Restaurant Name</h3>

        <p>Faleminderit që na vizituat!</p>

        <span>© 2026 Restaurant. All rights reserved.</span>

    </footer>


    <script src="js/menu.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
